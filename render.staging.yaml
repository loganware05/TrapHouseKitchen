# TrapHouse Kitchen — STAGING Blueprint (separate from production render.yaml)
#
# Create a second Blueprint in Render that points at this file (not render.yaml).
# Never reuse production Stripe live keys, webhook secrets, JWT, or VAPID keys here.
# Docs: docs/deployment/staging.md

databases:
  - name: traphousekitchen-db-staging
    region: virginia
    plan: basic-256mb
    databaseName: traphousekitchen_staging
    user: traphousekitchen_staging

services:
  - type: web
    name: traphousekitchen-api-staging
    runtime: node
    region: virginia
    plan: starter
    buildCommand: cd backend && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    # Do not seed on every boot. Fresh staging: seed once via Render shell after first migrate.
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: SHOW_PASSWORD_RESET_LINK
        value: "1"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: traphousekitchen-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      # Stripe TEST mode only — set in dashboard (sk_test_ / pk_test_ / test whsec)
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: TrapHouse Kitchen Staging <orders@traphousekitchen.com>
      - key: CHEF_EMAIL
        sync: false
      - key: REVIEW_WINDOW_DAYS
        value: 30
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_MAX_TOKENS
        value: "1024"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    healthCheckPath: /health

  - type: web
    name: traphousekitchen-web-staging
    runtime: static
    # Static sites cannot set region (Render Blueprint validation).
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
