name: Build and Deploy to AWS ECR

on:
  push:
    branches: [ main, production ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: traphouse-kitchen

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traphouse
          POSTGRES_PASSWORD: traphouse_dev_password
          POSTGRES_DB: traphouse_kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traphouse -d traphouse_kitchen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://traphouse:traphouse_dev_password@localhost:5432/traphouse_kitchen?schema=public

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Render/deploy references + migrations layout
        run: npm run repo:where-migrate-deploy && cd backend && npm run prisma:fix-migrations-dir
      
      - name: Prisma schema validate
        run: cd backend && npx prisma validate

      - name: Apply Prisma migrations
        run: cd backend && npx prisma migrate deploy

      - name: Backend full test suite
        run: cd backend && npm run test:all
      
      - name: TypeScript type check
        run: |
          cd backend && npx tsc --noEmit
          cd ../frontend && npx tsc --noEmit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traphouse
          POSTGRES_PASSWORD: traphouse_dev_password
          POSTGRES_DB: traphouse_kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traphouse -d traphouse_kitchen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://traphouse:traphouse_dev_password@localhost:5432/traphouse_kitchen?schema=public
      JWT_SECRET: traphouse-ci-e2e-jwt-secret
      NODE_ENV: development
      PLAYWRIGHT_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      CI: true

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Render/deploy references + migrations layout
        run: npm run repo:where-migrate-deploy && cd backend && npm run prisma:fix-migrations-dir

      - name: Prisma migrate (e2e DB)
        run: cd backend && npx prisma validate && npx prisma migrate deploy

      - name: Configure Stripe env for API boot
        env:
          STRIPE_SECRET_IN: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_IN: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          SECRET="$STRIPE_SECRET_IN"
          PUB="$STRIPE_PUBLISHABLE_IN"
          if [ -z "$SECRET" ]; then SECRET='sk_test_ci_placeholder_not_for_real_charges_only_server_boot'; fi
          if [ -z "$PUB" ]; then PUB='pk_test_ci_placeholder_not_for_real_charges_only_client_boot'; fi
          echo "STRIPE_SECRET_KEY=$SECRET" >> $GITHUB_ENV
          echo "STRIPE_PUBLISHABLE_KEY=$PUB" >> $GITHUB_ENV
          echo "VITE_STRIPE_PUBLISHABLE_KEY=$PUB" >> $GITHUB_ENV

      - name: Seed E2E data
        run: npm run e2e:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output image URI
        run: |
          echo "Image pushed to:"
          echo "${{ steps.meta.outputs.tags }}" | head -n 1

  deploy:
    name: Deploy to ECS (Optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Placeholder for ECS deployment
        run: |
          echo "Deploy to ECS here"
          echo "Use aws ecs update-service or similar"

